import asyncio
import json
import re
from datetime import datetime
from playwright.async_api import async_playwright

ZONAS = [
    {"slug": "iztapalapa", "nombre": "Iztapalapa", "url": "https://inmuebles.mercadolibre.com.mx/inmuebles-comerciales/renta/distrito-federal/iztapalapa/"},
    {"slug": "tlalpan", "nombre": "Tlalpan", "url": "https://inmuebles.mercadolibre.com.mx/inmuebles-comerciales/renta/distrito-federal/tlalpan/"},
    {"slug": "neza", "nombre": "Nezahualcóyotl", "url": "https://inmuebles.mercadolibre.com.mx/inmuebles-comerciales/renta/estado-de-mexico/nezahualcoyotl/"},
    {"slug": "chalco", "nombre": "Chalco", "url": "https://inmuebles.mercadolibre.com.mx/inmuebles-comerciales/renta/estado-de-mexico/chalco/"},
    {"slug": "ixtapaluca", "nombre": "Ixtapaluca", "url": "https://inmuebles.mercadolibre.com.mx/inmuebles-comerciales/renta/estado-de-mexico/ixtapaluca/"},
    {"slug": "la_paz", "nombre": "La Paz", "url": "https://inmuebles.mercadolibre.com.mx/inmuebles-comerciales/renta/estado-de-mexico/la-paz/"},
    {"slug": "chimalhuacan", "nombre": "Chimalhuacán", "url": "https://inmuebles.mercadolibre.com.mx/inmuebles-comerciales/renta/estado-de-mexico/chimalhuacan/"},
]

def clasificar(m2: float, texto: str):
    t = texto.lower()
    if any(k in t for k in ["ejidal", "cesion de derechos", "comunal"]):
        return None, None
        
    if 70 <= m2 <= 149:
        return "plaza", "Plaza / Food Court"
    elif 150 <= m2 < 500:
        return "street", "Street Front"
    elif 500 <= m2 <= 1500:
        return "freestanding", "Free-Standing (Drive-Thru)"
        
    # Si no especificó metros claros en el listado pero es comercial
    if m2 == 0:
        if any(k in t for k in ["plaza", "isla", "food court"]):
            return "plaza", "Plaza / Food Court (Verificar m²)"
        elif any(k in t for k in ["terreno", "lote", "bodega", "drive"]):
            return "freestanding", "Free-Standing (Verificar m²)"
        return "street", "Street Front (Verificar m²)"
        
    return None, None

async def scrapear_zona(page, zona):
    locales_zona = []
    try:
        await page.goto(zona["url"], wait_until="networkidle", timeout=45000)
        await page.wait_for_timeout(3000)
        
        # Selectores amplios para capturar tarjetas en cualquier versión de ML
        cards = await page.query_selector_all("li.ui-search-layout__item, div.ui-search-result__wrapper")
        print(f"[{zona['nombre']}] Encontradas {len(cards)} publicaciones.")
        
        for card in cards[:20]:
            texto_tarjeta = await card.inner_text()
            link_elem = await card.query_selector("a.ui-search-link, a")
            link = await link_elem.get_attribute("href") if link_elem else ""
            
            # Limpiar el link quitando parámetros de tracking
            if link and "#" in link:
                link = link.split("#")[0]
                
            # Extraer precio
            match_precio = re.search(r"\$\s*([\d,.]+)", texto_tarjeta)
            precio = f"${match_precio.group(1)} MXN" if match_precio else "A consultar"
            
            # Extraer m2 buscando números seguidos de m, m², m2 o metros
            match_m2 = re.search(r"(\d+(?:[.,]\d+)?)\s*(?:m²|m2|mts|metros)", texto_tarjeta, re.IGNORECASE)
            m2 = 0.0
            if match_m2:
                try:
                    m2 = float(match_m2.group(1).replace(",", ""))
                except ValueError:
                    m2 = 0.0
            
            # Extraer título (primera línea o elemento h2)
            h2 = await card.query_selector("h2")
            titulo = (await h2.inner_text()).strip() if h2 else texto_tarjeta.split("\n")[0][:80]
            
            proto_key, proto_label = clasificar(m2, texto_tarjeta)
            
            if proto_key:
                locales_zona.append({
                    "id": abs(hash(link or titulo)) % 1000000,
                    "titulo": titulo,
                    "municipio": zona["slug"],
                    "zona_label": zona["nombre"],
                    "m2": int(m2) if m2 > 0 else "N/D",
                    "prototipo": proto_key,
                    "proto_label": proto_label,
                    "precio": precio,
                    "url": link or zona["url"],
                    "status": "nuevo",
                    "es_esquina": "esquina" in texto_tarjeta.lower(),
                    "parking": any(k in texto_tarjeta.lower() for k in ["estacionamiento", "cajones", "aparcamiento", "autos"]),
                    "nota": texto_tarjeta.replace("\n", " ")[:140] + "..."
                })
    except Exception as e:
        print(f"Error procesando {zona['nombre']}: {e}")
        
    return locales_zona

async def main():
    async with async_playwright() as p:
        browser = await p.chromium.launch(
            headless=True,
            args=["--no-sandbox", "--disable-setuid-sandbox"]
        )
        context = await browser.new_context(
            user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36",
            viewport={"width": 1280, "height": 800}
        )
        page = await context.new_page()
        
        todos_locales = []
        for z in ZONAS:
            print(f"Scrapeando: {z['nombre']}...")
            res = await scrapear_zona(page, z)
            todos_locales.extend(res)
            
        await browser.close()
        
        # Deduplicar por URL o Título
        unicos = list({v["url"]: v for v in todos_locales if v["url"]}.values())
        
        payload = {
            "fecha_actualizacion": datetime.now().strftime("%d/%m/%Y %H:%M"),
            "total": len(unicos),
            "locales": unicos
        }
        
        with open("data.json", "w", encoding="utf-8") as f:
            json.dump(payload, f, ensure_ascii=False, indent=2)
            
        print(f"Total procesado con éxito: {len(unicos)} locales.")

if __name__ == "__main__":
    asyncio.run(main())
