    },
    {
        "slug": "neza",
        "nombre": "Nezahualcóyotl",
        "url": "https://inmuebles.mercadolibre.com.mx/inmuebles-comerciales/renta/estado-de-mexico/nezahualcoyotl/",
    },
    {
        "slug": "chalco",
